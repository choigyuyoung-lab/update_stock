name: KR ETF Holdings Sync

on:
  # cron-job.org 등 외부에서 API로 실행 신호를 보낼 때 사용
  repository_dispatch:
    types: [kr_etf_update]
  # 깃허브 웹사이트에서 수동으로 버튼을 눌러 실행할 때 사용
  workflow_dispatch:

jobs:
  update-etf:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETF Holdings Update
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DB_ID }}
          MASTER_DB_ID: ${{ secrets.MASTER_DB_ID }}
          DATABASE_ID: ${{ secrets.MASTER_DB_ID }}
          ETF_DB_ID: ${{ secrets.ETF_DB_ID }}
          # KIS 실전투자 전용 키 전달
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || secrets.KIS_PROD_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || secrets.KIS_PROD_APP_SECRET }}
        run: python update_etf_holdings_kr.py
