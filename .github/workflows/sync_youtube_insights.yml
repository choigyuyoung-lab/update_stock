name: "[유튜브] 🎬 유튜브 AI 시황 인텔리전스 동기화"

on:
  # 1. cron-job.org 및 외부 Webhook 트리거
  repository_dispatch:
    types: [youtube_sync, youtube_collector, sync_youtube_insights, job_sync_youtube]

  # 2. GitHub 웹 UI 수동 실행 트리거 (원클릭 심플 실행)
  workflow_dispatch:

jobs:
  youtube-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # -------------------------------------------------------------
      # 🚀 [Step 1: 대기열 AI 분석 및 노션 적재] 일반 인터넷망 직통 (Tailscale 연결 0초 소모)
      # 1. 스크립트 저장된 동영상 분석 먼저. 분석이 모두 끝나면 제미나이 API 종료
      # -------------------------------------------------------------
      - name: "Step 1: Process Pending Queue (Gemini AI & Notion)"
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID || secrets.STOCK_MASTER_DB_ID }}
          YOUTUBE_DATABASE_ID: ${{ secrets.YOUTUBE_DATABASE_ID || secrets.YOUTUBE_DB_ID }}
          YOUTUBE_GUIDE_DATABASE_ID: ${{ secrets.YOUTUBE_GUIDE_DATABASE_ID || secrets.YOUTUBE_GUIDE_DB_ID }}
          UNORGANIZED_DATABASE_ID: ${{ secrets.UNORGANIZED_DATABASE_ID || secrets.UNORGANIZED_DB_ID }}
          UNIFIED_NOTES_DATABASE_ID: ${{ secrets.UNIFIED_NOTES_DATABASE_ID || secrets.UNIFIED_NOTES_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: python -m jobs.youtube.job_sync_youtube_insights --process-queue-only

      # -------------------------------------------------------------
      # 📡 [Step 2: 신규 영상 초고속 탐지] 일반 초고속 인터넷망에서 YouTube RSS 피드 0.3초 병렬 스캔
      # 2. 유튜브 목록에서 새로운 동영상이 있는지 여부 파악 -> 신규 동영상 있는 채널에서 주소 확보
      # -------------------------------------------------------------
      - name: "Step 2: Detect New Videos via Fast RSS (Normal Internet)"
        id: detect_step
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_GUIDE_DATABASE_ID: ${{ secrets.YOUTUBE_GUIDE_DATABASE_ID || secrets.YOUTUBE_GUIDE_DB_ID }}
        run: python -m jobs.youtube.job_sync_youtube_insights --detect-new-videos

      # -------------------------------------------------------------
      # 🛡️ [Step 3-1: 공유기 PPTP VPN 연결 (1순위)] 신규 영상 존재 시 iptime 공유기 VPN 우선 연결
      # -------------------------------------------------------------
      - name: "Step 3-1: Connect PPTP VPN (1st Priority: Router)"
        id: pptp_step
        if: steps.detect_step.outputs.has_new == 'true'
        continue-on-error: true
        env:
          PPTP_SERVER: ${{ secrets.PPTP_SERVER }}
          PPTP_USER: ${{ secrets.PPTP_USERNAME }}
          PPTP_PASS: ${{ secrets.PPTP_PASSWORD }}
        run: |
          if [ -z "$PPTP_SERVER" ] || [ -z "$PPTP_USER" ] || [ -z "$PPTP_PASS" ]; then
            echo "⚠️ [PPTP 미설정] PPTP Secrets 누락 -> 2순위 Tailscale로 폴백합니다."
            echo "pptp_connected=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🚀 [1순위: 공유기 PPTP] iptime PPTP VPN 연결 시도 ($PPTP_SERVER)..."
          sudo apt-get update -qq && sudo apt-get install -y -qq pptp-linux ppp

          # 1. PPTP 도메인 -> IP 변환
          PPTP_SERVER_IP=$(getent hosts "$PPTP_SERVER" | awk '{ print $1 }' | head -n 1)
          if [ -z "$PPTP_SERVER_IP" ]; then
            PPTP_SERVER_IP="$PPTP_SERVER"
          fi
          echo "🌐 PPTP Server IP: $PPTP_SERVER_IP"

          # 2. 터널 라우팅 유지용 Host Route 등록 (기존 Default GW 고정)
          DEF_GW=$(ip route show default | awk '/default/ {print $3}' | head -n 1)
          DEF_IF=$(ip route show default | awk '/default/ {print $5}' | head -n 1)
          sudo ip route add "$PPTP_SERVER_IP" via "$DEF_GW" dev "$DEF_IF" || true

          # 3. PPTP 터널 생성 및 시작
          sudo pptpsetup --create pptp_vpn --server "$PPTP_SERVER" --username "$PPTP_USER" --password "$PPTP_PASS" --encrypt --start

          # 4. ppp0 인터페이스 생성 대기 (최대 10초)
          PPTP_UP=false
          for i in {1..10}; do
            if ip addr show dev ppp0 2>/dev/null | grep -q "inet"; then
              echo "✅ ppp0 터널 인터페이스 활성화 완료 (${i}초 소요)"
              PPTP_UP=true
              break
            fi
            sleep 1
          done

          if [ "$PPTP_UP" = "true" ]; then
            # 5. Default Route를 ppp0로 교체하여 모든 트래픽 우회
            sudo ip route replace default dev ppp0
            VPN_IP=$(curl -s --max-time 4 https://api.ipify.org || echo "확인불가")
            echo "🎉 [1순위 연결 성공] 공유기 PPTP VPN 우회 IP: $VPN_IP"
            echo "pptp_connected=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ [1순위 연결 실패] PPTP 인터페이스 미생성 -> 2순위 Tailscale로 폴백합니다."
            echo "pptp_connected=false" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------------
      # 🌟 [Step 3-2: 스마트폰 Tailscale Exit Node 연결 (2순위 폴백)]
      # PPTP 연결 실패 시에만 스마트폰 Tailscale을 백업망으로 연결
      # -------------------------------------------------------------
      - name: "Step 3-2: Connect Tailscale Smartphone Exit Node (2nd Priority Fallback)"
        id: tailscale_step
        if: steps.detect_step.outputs.has_new == 'true' && steps.pptp_step.outputs.pptp_connected != 'true'
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID || secrets.TAILSCALE_OAUTH_CLIENT_ID || secrets.OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET || secrets.TAILSCALE_OAUTH_SECRET || secrets.OAUTH_SECRET }}
          tags: ${{ secrets.TS_TAGS || secrets.TAILSCALE_TAGS || 'tag:ci' }}
          args: --exit-node=${{ secrets.TAILSCALE_EXIT_NODE || secrets.HOME_EXIT_NODE_IP || '100.97.245.94' }} --exit-node-allow-lan-access=false --accept-routes=true

      # -------------------------------------------------------------
      # 📥 [Step 4: yt-dlp 전용 자막 수집] 신규 영상에 대해서만 자막 추출 -> 대기열 등록 & 정렬
      # 4. yt-dlp만 사용해서 자막 수집, 안되면 pass / 5. 수집된 자막 대기열에 집어넣고 정렬
      # -------------------------------------------------------------
      - name: "Step 4: Fetch Subtitles via yt-dlp for New Videos"
        if: steps.detect_step.outputs.has_new == 'true'
        run: python -m jobs.youtube.job_sync_youtube_insights --fetch-target-videos

      # -------------------------------------------------------------
      # 🌟 [Step 5: VPN 즉시 해제 (Cleanup)] 작업 완료 후 PPTP & Tailscale 모두 안전 해제
      # -------------------------------------------------------------
      - name: "Step 5: Disconnect All VPNs Immediately"
        if: always() && steps.detect_step.outputs.has_new == 'true'
        run: |
          echo "🧹 [VPN 리소스 정리]"
          sudo poff pptp_vpn 2>/dev/null || true
          sudo tailscale logout 2>/dev/null || true

      # -------------------------------------------------------------
      # 🌟 [Step 6: 캐시/대기열 자동 커밋] 갱신된 캐시, 대기열 및 주소가이드 캐시 Git 자동 커밋 & 푸시
      # -------------------------------------------------------------
      - name: Commit & Push Updated Cache & Queue
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(youtube): auto-sync youtube insights queue and cache [skip ci]"
          file_pattern: ".processed_youtube_videos.json .youtube_pending_queue.json .youtube_guide_sources.json jobs/youtube/.processed_youtube_videos.json jobs/youtube/.youtube_pending_queue.json jobs/youtube/.youtube_guide_sources.json"
