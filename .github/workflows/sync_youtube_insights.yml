name: "[유튜브] 🎬 유튜브 AI 시황 인텔리전스 동기화"

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [youtube_sync, youtube_collector, sync_youtube_insights]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  youtube-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 🌟 스마트폰 무인 노드(Tailscale Exit Node for Android: a23) 연동 (노드 오프라인 시 Direct 자동 Fallback)
      - name: Connect Tailscale Smartphone Exit Node (Android)
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --exit-node=${{ secrets.TAILSCALE_EXIT_NODE || secrets.HOME_EXIT_NODE_IP || 'a23' }} --exit-node-allow-lan-access=false --accept-routes=true

      # 🌐 네트워크 라우팅 및 공인 IP 진단
      - name: Verify Network Route & Public IP
        run: |
          echo "🌐 [네트워크 진단] 현재 러너 공인 IP 및 라우팅 상태 확인..."
          CURRENT_IP=$(curl -s --max-time 5 https://ifconfig.me || curl -s --max-time 5 https://api.ipify.org || echo "Unknown")
          echo "📡 Outbound Public IP: $CURRENT_IP"
          if command -v tailscale &> /dev/null; then
            echo "📱 [Tailscale 상태]"
            tailscale status || true
          else
            echo "ℹ️ Tailscale 미가동 (Direct 통신 모드 유지)"
          fi

      # 🌟 처리된 영상 캐시 및 미처리 대기열(Queue) 복원/저장
      - name: Restore / Save YouTube Video Cache & Queue
        uses: actions/cache@v4
        with:
          path: |
            .processed_youtube_videos.json
            .youtube_pending_queue.json
          key: yt-processed-cache-${{ github.run_id }}
          restore-keys: |
            yt-processed-cache-


      - name: Run YouTube Auto Collector & Notion Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          YOUTUBE_DATABASE_ID: ${{ secrets.YOUTUBE_DATABASE_ID }}
          YOUTUBE_GUIDE_DATABASE_ID: ${{ secrets.YOUTUBE_GUIDE_DATABASE_ID }}
          UNORGANIZED_DATABASE_ID: ${{ secrets.UNORGANIZED_DATABASE_ID }}
          UNIFIED_NOTES_DATABASE_ID: ${{ secrets.UNIFIED_NOTES_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m jobs.youtube.job_sync_youtube_insights
