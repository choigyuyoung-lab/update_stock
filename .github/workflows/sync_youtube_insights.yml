name: "[유튜브] 🎬 유튜브 AI 시황 인텔리전스 동기화"

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [youtube_sync, youtube_collector, sync_youtube_insights]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  youtube-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 🌟 처리된 영상 중복 방지 캐시 복원/저장
      - name: Restore / Save YouTube Video Cache
        uses: actions/cache@v4
        with:
          path: .processed_youtube_videos.json
          key: yt-processed-cache-${{ github.run_id }}
          restore-keys: |
            yt-processed-cache-

      - name: Run YouTube Auto Collector & Notion Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          YOUTUBE_DATABASE_ID: ${{ secrets.YOUTUBE_DATABASE_ID }}
          YOUTUBE_GUIDE_DATABASE_ID: ${{ secrets.YOUTUBE_GUIDE_DATABASE_ID }}
          UNORGANIZED_DATABASE_ID: ${{ secrets.UNORGANIZED_DATABASE_ID }}
          UNIFIED_NOTES_DATABASE_ID: ${{ secrets.UNIFIED_NOTES_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m jobs.youtube.job_sync_youtube_insights
