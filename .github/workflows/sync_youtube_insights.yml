name: "[유튜브] 🎬 유튜브 AI 시황 인텔리전스 동기화"

on:
  # 1. cron-job.org 및 외부 Webhook 트리거
  repository_dispatch:
    types: [youtube_sync, youtube_collector, sync_youtube_insights, job_sync_youtube]

  # 2. GitHub 웹 UI 수동 실행 트리거 (원클릭 심플 실행)
  workflow_dispatch:

jobs:
  youtube-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # -------------------------------------------------------------
      # 🌟 [Phase 1: 자막 수집 구간] 스마트폰 Exit Node 연동 (일회성 ephemeral 노드)
      # -------------------------------------------------------------
      - name: "Connect Tailscale Smartphone Exit Node (Ephemeral)"
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID || secrets.TAILSCALE_OAUTH_CLIENT_ID || secrets.OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET || secrets.TAILSCALE_OAUTH_SECRET || secrets.OAUTH_SECRET }}
          tags: ${{ secrets.TS_TAGS || secrets.TAILSCALE_TAGS || 'tag:ci' }}
          args: --exit-node=${{ secrets.TAILSCALE_EXIT_NODE || secrets.HOME_EXIT_NODE_IP || '100.97.245.94' }} --exit-node-allow-lan-access=false --accept-routes=true

      # 🚀 1단계: 유튜브 자막 및 메타데이터 수집만 실행 (Tailscale Exit Node 구간, 약 10~20초 소요)
      - name: "Phase 1: Fetch YouTube Subtitles & Enqueue"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_GUIDE_DATABASE_ID: ${{ secrets.YOUTUBE_GUIDE_DATABASE_ID }}
        run: python -m jobs.youtube.job_sync_youtube_insights --fetch-only

      # 🌟 1단계 완료 즉시 Tailscale 해제 (Tailscale 무료 시간 카운팅 중지 및 ephemeral 노드 자동 삭제)
      - name: "Disconnect Tailscale Immediately"
        if: always()
        run: sudo tailscale logout || true

      # -------------------------------------------------------------
      # 🚀 [Phase 2: AI 분석 및 노션 적재 구간] GitHub 초고속 일반망 직통 (Tailscale 0초 소모)
      # -------------------------------------------------------------
      - name: "Phase 2: Run Gemini AI Analysis & Notion Sync"
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          YOUTUBE_DATABASE_ID: ${{ secrets.YOUTUBE_DATABASE_ID }}
          YOUTUBE_GUIDE_DATABASE_ID: ${{ secrets.YOUTUBE_GUIDE_DATABASE_ID }}
          UNORGANIZED_DATABASE_ID: ${{ secrets.UNORGANIZED_DATABASE_ID }}
          UNIFIED_NOTES_DATABASE_ID: ${{ secrets.UNIFIED_NOTES_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m jobs.youtube.job_sync_youtube_insights --process-only

      # 🌟 최신 처리 완료 캐시 및 대기열(Queue)을 GitHub 저장소에 자동 커밋 & 푸시
      - name: Commit & Push Updated Cache & Queue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(youtube): auto-sync youtube insights queue and cache [skip ci]"
          file_pattern: ".processed_youtube_videos.json .youtube_pending_queue.json jobs/youtube/.processed_youtube_videos.json jobs/youtube/.youtube_pending_queue.json"
