name: Daily Stock Matcher

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [daily_matcher, sync_unorganized_stocks]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  match-stocks:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Matcher & FX Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          UNORGANIZED_DATABASE_ID: ${{ secrets.UNORGANIZED_DATABASE_ID || '2d8f59dbdb5b807aac70d3711b5b6e93' }}
          UNIFIED_NOTES_DATABASE_ID: ${{ secrets.UNIFIED_NOTES_DATABASE_ID || '2f8f59dbdb5b804e8318e9a3f0efaf9d' }}
        run: python sync_unorganized_stocks.py
