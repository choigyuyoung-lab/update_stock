name: KR Master DB Sync

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [kr_master_sync]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 🌟 KIS API 토큰 24시간 재사용 캐시
      - name: Restore / Save KIS Token Cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-cache-${{ github.run_id }}
          restore-keys: |
            kis-token-cache-
          
      - name: Run KR Master DB Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          BENCHMARK_DATABASE_ID: ${{ secrets.BENCHMARK_DATABASE_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || secrets.KIS_PROD_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || secrets.KIS_PROD_APP_SECRET }}
          IS_FULL_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python update_master_db_kr.py