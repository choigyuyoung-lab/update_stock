name: Generate Portfolio K-All-Round Master Report

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [generate_report, portfolio_report]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  portfolio-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run K-All-Round Master Portfolio Report Generation
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          ACCOUNT_STATUS_DB_ID: ${{ secrets.ACCOUNT_STATUS_DB_ID }}
          STOCK_HOLDINGS_DB_ID: ${{ secrets.STOCK_HOLDINGS_DB_ID }}
          ACCOUNT_HOLDINGS_DB_ID: ${{ secrets.ACCOUNT_HOLDINGS_DB_ID }}
          TRADE_LOG_DB_ID: ${{ secrets.TRADE_LOG_DB_ID }}
          CASH_FLOW_DB_ID: ${{ secrets.CASH_FLOW_DB_ID }}
          NOTION_REPORT_DB_ID: ${{ secrets.NOTION_REPORT_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_portfolio_report.py
