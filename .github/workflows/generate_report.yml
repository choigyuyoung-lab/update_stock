name: Generate Portfolio All-Weather Report

on:
  repository_dispatch:
    types: [generate_report, portfolio_report]
  workflow_dispatch:
  # 매일 한국시간 오전 09:00 (UTC 00:00) 정기 자산배분 진단 리포트 실행
  schedule:
    - cron: '0 0 * * *'

jobs:
  portfolio-report:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Upgrade pip & Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run All-Weather Portfolio Report Generation
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          ACCOUNT_STATUS_DB_ID: ${{ secrets.ACCOUNT_STATUS_DB_ID }}
          STOCK_HOLDINGS_DB_ID: ${{ secrets.STOCK_HOLDINGS_DB_ID }}
          ACCOUNT_HOLDINGS_DB_ID: ${{ secrets.ACCOUNT_HOLDINGS_DB_ID }}
          TRADE_LOG_DB_ID: ${{ secrets.TRADE_LOG_DB_ID }}
          CASH_FLOW_DB_ID: ${{ secrets.CASH_FLOW_DB_ID }}
          NOTION_REPORT_DB_ID: ${{ secrets.NOTION_REPORT_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_portfolio_report.py
