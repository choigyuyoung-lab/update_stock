name: "[시세] 🇺🇸 해외 주식 일별 시세 수집"

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [us_update, us_price_update, sync_price_us]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  update-us:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt
          
      - name: Run US Price Update
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python -m jobs.price.job_sync_price_us