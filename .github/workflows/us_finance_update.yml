name: US Finance Update

on:
  repository_dispatch:
    types: [us_finance]
  workflow_dispatch:

jobs:
  update-us-finance:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js 경고 제거

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 🌟requirements.txt가 준비되었으므로 캐시를 활성화하여 속도를 올립니다.

      # 🌟 이 부분을 수정했습니다: 개별 나열 대신 txt 목록으로 안전하게 일괄 설치합니다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run US Finance Update
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python update_finance_us.py

      # 🌟 재무 업데이트 완료 후 한-미 듀얼 올웨더 자산배분 진단 리포트 생성 및 노션 DB 적재
      - name: Generate Portfolio All-Weather Report
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          ACCOUNT_STATUS_DB_ID: ${{ secrets.ACCOUNT_STATUS_DB_ID }}
          STOCK_HOLDINGS_DB_ID: ${{ secrets.STOCK_HOLDINGS_DB_ID }}
          ACCOUNT_HOLDINGS_DB_ID: ${{ secrets.ACCOUNT_HOLDINGS_DB_ID }}
          TRADE_LOG_DB_ID: ${{ secrets.TRADE_LOG_DB_ID }}
          CASH_FLOW_DB_ID: ${{ secrets.CASH_FLOW_DB_ID }}
          NOTION_REPORT_DB_ID: ${{ secrets.NOTION_REPORT_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_portfolio_report.py