name: KR Stock Price Update

on:
  repository_dispatch:
    types: [kr_update]
  workflow_dispatch:

jobs:
  update-kr:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🌟 이 부분을 수정했습니다: 개별 패키지가 아닌 txt 파일 목록을 통째로 설치합니다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🌟 KIS API 토큰 24시간 재사용 캐시 (하루 알림 1회 제한)
      - name: Restore / Save KIS Token Cache
        uses: actions/cache@v4
        with:
          path: .kis_token_cache.json
          key: kis-token-cache-${{ github.run_id }}
          restore-keys: |
            kis-token-cache-

      - name: Run KR Price Update
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          # KIS 실전투자 및 모의투자 키 설정
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY || secrets.KIS_PROD_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET || secrets.KIS_PROD_APP_SECRET }}
          KIS_PROD_APP_KEY: ${{ secrets.KIS_PROD_APP_KEY }}
          KIS_PROD_APP_SECRET: ${{ secrets.KIS_PROD_APP_SECRET }}
          KIS_VTS_APP_KEY: ${{ secrets.KIS_VTS_APP_KEY }}
          KIS_VTS_APP_SECRET: ${{ secrets.KIS_VTS_APP_SECRET }}
        run: python update_price_kr.py

      # 🌟 시세 업데이트 완료 후 한-미 듀얼 올웨더 자산배분 진단 리포트 생성 및 노션 DB 적재
      - name: Generate Portfolio All-Weather Report
        if: always()
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          ACCOUNT_STATUS_DB_ID: ${{ secrets.ACCOUNT_STATUS_DB_ID }}
          STOCK_HOLDINGS_DB_ID: ${{ secrets.STOCK_HOLDINGS_DB_ID }}
          ACCOUNT_HOLDINGS_DB_ID: ${{ secrets.ACCOUNT_HOLDINGS_DB_ID }}
          TRADE_LOG_DB_ID: ${{ secrets.TRADE_LOG_DB_ID }}
          CASH_FLOW_DB_ID: ${{ secrets.CASH_FLOW_DB_ID }}
          NOTION_REPORT_DB_ID: ${{ secrets.NOTION_REPORT_DB_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_portfolio_report.py