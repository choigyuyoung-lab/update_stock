name: US/Global Master DB Sync

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [us_master_sync]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
          
      - name: Run US Master DB Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          BENCHMARK_DATABASE_ID: ${{ secrets.BENCHMARK_DATABASE_ID }}
          IS_FULL_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python update_master_db_us.py