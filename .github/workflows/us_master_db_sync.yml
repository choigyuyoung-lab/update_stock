name: US/Global Master DB Sync

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [us_master_sync]

  # 2. GitHub 웹 UI 수동 실행 트리거 ("Run workflow" 버튼)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js 경고 제거
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 🌟 캐시를 활성화하여 깃허브 서버의 패키지 설치 속도를 높입니다.
        
    - name: Upgrade pip & Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run US Update
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
        BENCHMARK_DATABASE_ID: ${{ secrets.BENCHMARK_DATABASE_ID }}
        IS_FULL_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      run: python update_master_db_us.py