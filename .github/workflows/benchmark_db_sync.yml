name: Benchmark DB Sync & Health Check

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [benchmark_sync]

  # 2. GitHub 웹 UI 수동 실행 트리거 ("Run workflow" 버튼)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Upgrade pip & Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Benchmark Sync & Health Check
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
        BENCHMARK_DATABASE_ID: ${{ secrets.BENCHMARK_DATABASE_ID }}
      run: python update_benchmark_db.py
