name: "[매크로] 🌐 벤치마크 지수 및 환율 동기화"

on:
  # 1. cron-job.org 외부 Webhook 트리거
  repository_dispatch:
    types: [benchmark_sync, benchmark_db_sync, sync_benchmark]

  # 2. GitHub 웹 UI 수동 실행 트리거
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
          
      - name: Run Benchmark Sync & Health Check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MASTER_DATABASE_ID: ${{ secrets.MASTER_DATABASE_ID }}
          BENCHMARK_DATABASE_ID: ${{ secrets.BENCHMARK_DATABASE_ID }}
        run: python -m jobs.macro.job_sync_benchmark
